name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: codex-auth
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CODEX_HOME: ${{ runner.temp }}/codex
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install Claude Code
        run: |
          npm install --global --prefix "$RUNNER_TEMP/claude" @anthropic-ai/claude-code
          echo "$RUNNER_TEMP/claude/bin" >> "$GITHUB_PATH"
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run typecheck
      - run: bun run validate
      - name: Restore Codex login
        id: restore
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: |
          mkdir -m 700 "$CODEX_HOME"
          echo 'cli_auth_credentials_store = "file"' > "$CODEX_HOME/config.toml"
          printf '%s' "$CODEX_AUTH_JSON" > "$CODEX_HOME/auth.json"
          chmod 600 "$CODEX_HOME/auth.json"
      - name: Test
        env:
          CORRECTIONGUY_TOKENMAXXING: "0"
        run: bun run test
      - name: Save Codex login
        if: always() && steps.restore.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.CODEX_AUTH_WRITEBACK_TOKEN }}
        run: gh secret set CODEX_AUTH_JSON --repo "$GITHUB_REPOSITORY" < "$CODEX_HOME/auth.json"
